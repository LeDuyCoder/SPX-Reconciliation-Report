[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spx-reconciliation-report"
version = "0.1.0"
description = "SPX Reconciliation Report — ứng dụng desktop PySide6"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "openpyxl>=3.1", "xlrd>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spx_reconciliation_report = ["assets/*.png", "ui/styles/*.qss"]

